<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" role="img" aria-label="招财机器人接线原理图：ESP32-S3 主控连接 3.5 寸并口屏、GT911 触摸、MAX98357A 功放、INMP441 麦克风和两个串联的飞特 STS3215 舵机">
  <title>招财机器人 · 接线原理图</title>
  <defs>
    <style>
      .box{fill:#FBF9F4;stroke:#161616;stroke-width:2.5}
      .h{font-size:20px;font-weight:700;fill:#161616}
      .s{font-size:14px;fill:#66625A}
      .p{font-size:15px;fill:#161616;font-family:Consolas, "Cascadia Mono", Menlo, monospace}
      .pin{font-size:14px;fill:#F4F1EA;font-family:Consolas, "Cascadia Mono", Menlo, monospace}
      .w{fill:none;stroke:#161616;stroke-width:2.5}
      .bus{fill:none;stroke:#161616;stroke-width:7}
      .i2s{fill:none;stroke:#9B7EF0;stroke-width:2.5}
      .ser{fill:none;stroke:#D7262B;stroke-width:2.5}
      .pwr{fill:none;stroke:#F2B33D;stroke-width:3.5}
      .gnd{fill:none;stroke:#8F8A7E;stroke-width:2.5;stroke-dasharray:7 5}
      .note{font-size:13px;fill:#8F8A7E}
    </style>
  </defs>
  <rect width="1200" height="830" fill="#F4F1EA"/>
  <text x="40" y="44" font-size="28" font-weight="800" fill="#161616">招财机器人 · 接线原理图</text>
  <text x="40" y="70" class="s">全部 GPIO 已用满；35–37（PSRAM）、0/45/46（启动脚）、43/44（CH340）、48（RGB 灯）、5（电池分压）不能接</text>

  <!-- ===== 主控 ===== -->
  <rect x="440" y="190" width="320" height="380" rx="18" fill="#161616"/>
  <text x="600" y="228" text-anchor="middle" font-size="22" font-weight="800" fill="#F4F1EA">ESP32-S3 主控</text>
  <text x="600" y="252" text-anchor="middle" font-size="13" fill="#CFC6B2">维可思 DEMO V3.2 · WROOM-1 N16R8</text>
  <text x="600" y="270" text-anchor="middle" font-size="13" fill="#CFC6B2">16 MB Flash · 8 MB 八线 PSRAM</text>
  <!-- 左侧引脚 -->
  <text x="456" y="312" class="pin">1 2 7 8 3 18 17 16</text>
  <text x="456" y="334" class="pin">10 9 14 15 6 · 4</text>
  <text x="456" y="440" class="pin">42 41 40 39</text>
  <!-- 右侧引脚 -->
  <text x="744" y="312" class="pin" text-anchor="end">12 BCLK</text>
  <text x="744" y="334" class="pin" text-anchor="end">13 WS/LRC</text>
  <text x="744" y="356" class="pin" text-anchor="end">11 DIN</text>
  <text x="744" y="440" class="pin" text-anchor="end">38 SD</text>
  <!-- 底部引脚 -->
  <text x="520" y="556" class="pin" text-anchor="middle">TX 21</text>
  <text x="640" y="556" class="pin" text-anchor="middle">RX 47</text>
  <!-- 顶部 USB -->

  <!-- ===== 屏幕 ===== -->
  <rect x="40" y="110" width="300" height="180" rx="14" class="box"/>
  <text x="60" y="142" class="h">3.5″ 屏 ST7796U</text>
  <text x="60" y="164" class="s">480×320 · 8 位并口</text>
  <text x="60" y="194" class="p">D0–D7 → 1,2,7,8,3,18,17,16</text>
  <text x="60" y="218" class="p">CS 10 · DC 9 · RST 14</text>
  <text x="60" y="242" class="p">WR 15 · RD 6</text>
  <text x="60" y="266" class="p">背光 BL 4（低电平亮）</text>
  <path class="bus" d="M340 200 H390 V318 H440"/>
  <text x="352" y="190" class="note">8 位数据总线 + 控制线</text>

  <!-- ===== 触摸 ===== -->
  <rect x="40" y="350" width="300" height="130" rx="14" class="box"/>
  <text x="60" y="382" class="h">电容触摸 GT911</text>
  <text x="60" y="404" class="s">I²C 地址 0x5D（同屏幕模组）</text>
  <text x="60" y="434" class="p">SDA 42 · SCL 41</text>
  <text x="60" y="458" class="p">INT 40 · RST 39</text>
  <path class="w" d="M340 435 H440"/>
  <text x="352" y="426" class="note">I²C</text>

  <!-- ===== 功放 + 喇叭 ===== -->
  <rect x="860" y="110" width="300" height="160" rx="14" class="box"/>
  <text x="880" y="142" class="h">功放 MAX98357A</text>
  <text x="880" y="164" class="s">I²S 输出 · 播放语音合成</text>
  <text x="880" y="194" class="p">BCLK 12 · LRC 13</text>
  <text x="880" y="218" class="p">DIN 11</text>
  <g transform="translate(1080 196)"><path d="M0 12h14l18-16v48l-18-16H0z" fill="#161616"/><path d="M40 6q10 14 0 28M48 0q16 20 0 40" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round"/></g>
  <text x="880" y="252" class="note">→ 喇叭</text>

  <!-- ===== 麦克风 ===== -->
  <rect x="860" y="350" width="300" height="160" rx="14" class="box"/>
  <text x="880" y="382" class="h">麦克风 INMP441</text>
  <text x="880" y="404" class="s">I²S 输入 · 16 kHz 录音</text>
  <text x="880" y="434" class="p">SCK 12 · WS 13 · SD 38</text>
  <text x="880" y="458" class="p">L/R → GND · VDD 3.3 V</text>

  <!-- I2S：BCLK / WS 两个外设共用 -->
  <path class="i2s" d="M760 307 H810 V185 H860"/>
  <path class="i2s" d="M760 329 H822 V209 H860"/>
  <path class="i2s" d="M760 351 H834 V214"/>
  <path class="i2s" d="M810 307 V425 H860"/>
  <path class="i2s" d="M822 329 V430 H860"/>
  <path class="i2s" d="M760 435 H860"/>
  <circle cx="810" cy="307" r="4.5" fill="#9B7EF0"/><circle cx="822" cy="329" r="4.5" fill="#9B7EF0"/>
  <text x="860" y="535" class="note">I²S：BCLK 12 / WS 13 由功放和麦克风共用</text>

  <!-- ===== 舵机总线（半双工，电阻分压） ===== -->
  <path class="ser" d="M520 570 V620"/>
  <path class="ser" d="M640 570 V620"/>
  <rect x="502" y="620" width="36" height="58" rx="4" fill="#FBF9F4" stroke="#D7262B" stroke-width="2.5"/>
  <rect x="622" y="620" width="36" height="58" rx="4" fill="#FBF9F4" stroke="#D7262B" stroke-width="2.5"/>
  <text x="494" y="654" class="p" text-anchor="end">≈3.3 kΩ</text>
  <text x="494" y="672" class="note" text-anchor="end">3×10 kΩ 并联</text>
  <text x="666" y="654" class="p">≈5 kΩ</text>
  <text x="666" y="672" class="note">2×10 kΩ 并联</text>
  <path class="ser" d="M520 678 V720 H640 V678"/>
  <circle cx="580" cy="720" r="5" fill="#D7262B"/>
  <path class="ser" d="M580 720 V750 H760"/>
  <text x="590" y="742" class="p" fill="#D7262B">DATA · 115200 波特</text>

  <rect x="760" y="700" width="180" height="80" rx="14" class="box" stroke="#D7262B"/>
  <text x="780" y="730" class="h">STS3215 · ID1</text>
  <text x="780" y="756" class="s">俯仰 · 点头 ±20°</text>
  <rect x="980" y="700" width="180" height="80" rx="14" class="box" stroke="#D7262B"/>
  <text x="1000" y="730" class="h">STS3215 · ID2</text>
  <text x="1000" y="756" class="s">偏航 · 转头 ±10°</text>
  <path class="ser" d="M940 740 H980"/>
  <text x="944" y="732" class="note">串联</text>

  <!-- ===== 电源 ===== -->
  <rect x="40" y="560" width="300" height="80" rx="14" class="box" stroke="#F2B33D"/>
  <text x="60" y="592" class="h">USB-C 5 V</text>
  <text x="60" y="616" class="s">供电 + 烧录 / 串口日志（GPIO 19/20）</text>
  <path class="pwr" d="M340 600 H400 V520 H440"/>
  <rect x="40" y="680" width="300" height="80" rx="14" class="box" stroke="#F2B33D"/>
  <text x="60" y="712" class="h">12 V 电源</text>
  <text x="60" y="736" class="s">只给舵机供电</text>
  <path class="pwr" d="M340 705 H420 V805 H1070 V780"/>
  <path class="pwr" d="M850 805 V780"/>
  <path class="gnd" d="M340 740 H400 V560 H440"/>
  <text x="60" y="665" class="note">GND 和主控共地（虚线），12 V 只接舵机</text>

  <!-- 图例 -->
  <g transform="translate(860 585)">
    <text x="0" y="0" class="s" font-weight="700" fill="#161616">图例</text>
    <path class="bus" d="M0 22 H40"/><text x="52" y="27" class="note">并口总线</text>
    <path class="i2s" d="M150 22 H190"/><text x="202" y="27" class="note">I²S 音频</text>
    <path class="ser" d="M0 52 H40"/><text x="52" y="57" class="note">舵机串行总线</text>
    <path class="pwr" d="M150 52 H190"/><text x="202" y="57" class="note">电源</text>
    <path class="gnd" d="M0 82 H40"/><text x="52" y="87" class="note">共地</text>
  </g>
</svg>
