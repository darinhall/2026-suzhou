; DeskBot 身体：ESP32 + 两个飞特 ST3215（偏航 ID1、俯仰 ID2），只管运动和"按头"检测，脸在 esp32s3/bringup。
; 两个环境：板子还没定就都能编译；引脚用 build_flags 改，不用动代码。
;
;   uvx --python 3.12 --from platformio pio run -d body -e body-esp32         # 普通 ESP32 开发板
;   uvx --python 3.12 --from platformio pio run -d body -e body-s3            # ESP32-S3（比如 DEMO 板）
;   ... -t upload --upload-port <端口>

[env]
platform = espressif32@~6.4.0
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> +<../../shared/net.cpp>
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -I../shared
    -I../config                                ; deskbot_net.h（先运行 python3 config/build_net.py）
    -DCORE_DEBUG_LEVEL=1
    -DDB_ROLE=\"body\"
    -DFW_VERSION=\"0.1.0\"
    ; ---- 舵机总线（半双工 TTL，1 Mbps）----
    ; SERVO_DIR = -1：TX 经 1 kΩ 电阻接 DATA，RX 直接接 DATA，发出去的字节会回显，固件自己丢掉。
    ; SERVO_DIR = 某个引脚：外接 74LVC2G125 / 方向控制，发送时拉高。
    ; 方向相反（抬头反而低头）就把 SIGN 改成 -1。
    -DSERVO_YAW_ID=1
    -DSERVO_PITCH_ID=2
    -DSERVO_YAW_SIGN=1
    -DSERVO_PITCH_SIGN=1
    -DSERVO_DIR=-1

[env:body-esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DSERVO_RX=16
    -DSERVO_TX=17

[env:body-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSERVO_RX=47                              ; DEMO 板上屏幕 / 触摸 / PSRAM 没占的脚：21、47、48、38
    -DSERVO_TX=21
