; 维可思 ESP32-S3 DEMO（ESP32-S3-WROOM-1-N16R8）+ 3.5″ 8 位并口屏（ST7796U）+ GT911 触摸
; 板级设置、引脚都来自厂家资料包 v2.3 的例程 ESP32-S3-LVGL-PIO-PROJECT-TFT3.5-ST7796U-CPT
; （platformio.ini、Setup_myTFT_ST7796_parallel.h、lv_port_indev.h），见 esp32s3/README.md。
;
;   uvx --python 3.12 --from platformio pio run -d esp32s3/bringup                     # 编译
;   uvx --python 3.12 --from platformio pio run -d esp32s3/bringup -t upload --upload-port /dev/cu.usbmodem101
;   uvx --python 3.12 --from platformio pio device monitor -b 115200 -p /dev/cu.usbmodem101

[env:deskbot-s3]
platform = espressif32@~6.4.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi      ; N16R8：16 MB flash + 8 MB 八线 PSRAM

monitor_speed = 115200
build_src_filter = +<*> +<../../../shared/net.cpp>   ; 联网部分和身体共用

lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#v2.4.72     ; 厂家用的是 2.4.71，和 2.4.72 只差一行无关紧要的代码
    tamctec/TAMC_GT911@^1.0.2
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DBOARD_HAS_PSRAM
    -I../../shared
    -I../../config                             ; deskbot_net.h：WiFi、端口、发现协议、令牌（先运行 python3 config/build_net.py）
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1                ; 串口日志走板子下面那个 USB-C（芯片自带 USB）
    -DCORE_DEBUG_LEVEL=1
    ; ---- TFT_eSPI：不用库里的 User_Setup，全部从这里传 ----
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER
    -DTFT_PARALLEL_8_BIT
    -DTFT_CS=10
    -DTFT_DC=9                                 ; DC 就是 RS
    -DTFT_RST=14
    -DTFT_WR=15
    -DTFT_RD=6
    -DTFT_D0=1
    -DTFT_D1=2
    -DTFT_D2=7
    -DTFT_D3=8
    -DTFT_D4=3
    -DTFT_D5=18
    -DTFT_D6=17
    -DTFT_D7=16
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=LOW                     ; 背光低电平点亮
    -DSMOOTH_FONT                              ; 平滑字体：从内存里的 .vlw 数组读（esp32s3/tools/make_vlw.py 生成、pack_fonts.py 打包）
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    ; 屏幕方向：厂家例程用 3，在我们的白色头盒里是倒着的；1 才是正的
    -DSCREEN_ROTATION=1
