# DeskBot 云端中枢：https://api-suzhou-hackathon.ppclaw.cn
#   /robot  → WebSocket，转给 127.0.0.1:8765（hub/mock_hub.py --proxy）
#   其他    → 模拟器网页 sim/（静态文件）
# 证书由 certbot --nginx 自动加到这个文件里（443 + 80→443 跳转）。
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name api-suzhou-hackathon.ppclaw.cn;

    root /home/ubuntu/deskbot/sim;
    index index.html;

    location /robot {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # 板子 20 秒一次心跳；别让 nginx 默认 60 秒把长连接掐掉
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
